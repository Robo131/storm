name: StormScope
options:
  bundleIdPrefix: com.stormscope
  deploymentTarget:
    iOS: "16.0"
targets:
  StormScope:
    type: application
    platform: iOS
    sources:
      - path: StormScope
      - path: ../public
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stormscope.uk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
    info:
      path: StormScope/Info.plist
      properties:
        CFBundleDisplayName: StormScope
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: StormScope connects to your own StormScope backend on your local network for storm detection.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
